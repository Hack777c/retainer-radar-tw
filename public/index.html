<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雇員雷達｜FFXIV 繁中服</title>
  <meta name="description" content="每小時整點更新的 FFXIV 繁中服雇員採集與生產職業市場收益排行">
  <link rel="icon" type="image/png" href="assets/ffxiv-mark.png">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
<header class="hero">
  <nav><span class="brandMark" title="FFXIV 雷達">R</span><div class="radar-nav" id="sections"><button class="active" data-section="retainer">雇員雷達</button><button data-section="craft">生產雷達</button></div><em class="server-badge">繁中服</em><div class="pulse"><div><i></i><span id="update-countdown">更新倒數 --:--:--</span></div><small>版本：7.2</small></div></nav>
  <section class="controls">
    <label>交易世界<select id="world"></select></label>
    <label id="gather-control">獲得力<input id="gathering" type="number" value="3681"><small>決定能否派遣該採集物品</small></label>
    <label id="stat-control"><span id="stat-label">鑑別力</span><input id="stat" type="number" value="2987"><small id="stat-help">決定每趟實際帶回數量</small></label>
    <label id="level-control" hidden>最高配方等級<input id="craft-level" type="number" min="1" max="100" value="100"><small>分析 Lv1–100，包含所有秘笈配方</small></label>
    <label id="craftsmanship-control" hidden>作業精度<input id="craftsmanship" type="number" min="0" value="0"><small id="craftsmanship-help">自動採用目前首選配方的最低門檻</small></label>
    <label id="control-control" hidden>加工精度<input id="control" type="number" min="0" value="0"><small id="control-help">自動採用目前首選配方的最低門檻</small></label>
  </section>
</header>
<main>
  <div class="toolbar"><div class="tabs" id="jobs"></div><div class="switch" id="modes"><button class="active" data-mode="stable">最穩定收益</button><button data-mode="gross">最高收益</button></div></div>
  <div id="craft-note" class="notice" hidden>成本採用目前 NQ 原料最低掛單價並包含碎晶／水晶；收入已扣除 5% 市場手續費。HQ 排名假設你能穩定製作 HQ 成品。</div>
  <div id="status" class="state"><span class="loader"></span>讀取市場排行中…</div>
  <section id="results" hidden>
    <article class="winner"><div class="rank">今日首選<b>01</b></div><img id="winner-icon" class="winner-icon" alt=""><div class="winner-name"><span id="winner-job"></span><h2 id="winner-name"></h2><p id="winner-detail"></p></div><div class="winner-stats"><div><span id="winner-gross-label">每趟毛收益</span><b id="winner-gross"></b></div><div><span id="winner-risk-label">風險調整收益</span><b id="winner-risk"></b></div></div></article>
    <div class="table-wrap"><table><thead id="table-head"></thead><tbody id="ranking"></tbody></table></div>
  </section>
  <footer><div><b>計算方式</b><p id="formula"></p><small>非 Square Enix 官方網站。資料來源：Universalis。</small></div><div class="updated"><span>資料產生時間</span><b id="updated">—</b><small>GitHub Actions · 每小時整點更新</small><div class="author">作者　遊戲名稱：李東海<br>伺服器：伊弗利特</div></div></footer>
</main>
<script src="app.js?v=9"></script>
</body></html>
