<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雇員雷達｜FFXIV 繁中服</title>
  <meta name="description" content="每 12 小時更新的雇員採集與生產職業市場收益排行">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <nav><div class="brand"><span class="brandMark">R</span> 雇員雷達 <em>繁中服</em></div><div class="pulse"><i></i>每 12 小時更新</div></nav>
  <div class="headline"><p class="eyebrow">MARKET INTELLIGENCE</p><h1>別追最高價。<br><span>追真正賣得掉的收益。</span></h1><p class="lead">結合成本、30 天成交、價格波動與庫存壓力，找出現在最值得採集或製作的物品。</p></div>
  <section class="controls">
    <label>交易世界<select id="world"></select></label>
    <label id="stat-control"><span id="stat-label">鑑別力</span><input id="stat" type="number" value="5238"><small id="stat-help">用來判定採集雇員帶回量（不是獲得力）</small></label>
    <label id="level-control" hidden>最高配方等級<input id="craft-level" type="number" min="80" max="100" value="100"><small>目前分析 Lv80–100 可交易配方</small></label>
  </section>
</header>
<main>
  <div class="section-switch" id="sections"><button class="active" data-section="retainer">雇員採集排行</button><button data-section="craft">生產職業排行</button></div>
  <div class="toolbar"><div class="tabs" id="jobs"></div><div class="switch" id="modes"><button class="active" data-mode="stable">最穩定收益</button><button data-mode="gross">最高收益</button></div></div>
  <div id="craft-note" class="notice" hidden>成本採用目前 NQ 原料最低掛單價並包含碎晶／水晶；收入已扣除 5% 市場手續費。HQ 排名假設你能穩定製作 HQ 成品。</div>
  <div id="status" class="state"><span class="loader"></span>讀取市場排行中…</div>
  <section id="results" hidden>
    <article class="winner"><div class="rank">今日首選<b>01</b></div><div class="winner-name"><span id="winner-job"></span><h2 id="winner-name"></h2><p id="winner-detail"></p></div><div class="winner-stats"><div><span id="winner-gross-label">每趟毛收益</span><b id="winner-gross"></b></div><div><span id="winner-risk-label">風險調整收益</span><b id="winner-risk"></b></div></div></article>
    <div class="table-wrap"><table><thead id="table-head"></thead><tbody id="ranking"></tbody></table></div>
  </section>
  <footer><div><b>計算方式</b><p id="formula"></p><small>非 Square Enix 或 FFXIV_Market 官方網站。資料來源：Universalis、FFXIV_Market。</small></div><div class="updated"><span>資料產生時間</span><b id="updated">—</b><small>GitHub Actions · 每 12 小時</small></div></footer>
</main>
<script src="app.js"></script>
</body></html>
